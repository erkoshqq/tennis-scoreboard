<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Scoreboard | Finished Matches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
</head>

<body>
<header class="header">
    <section class="nav-header">
        <div class="brand">
            <div class="nav-toggle">
                <img th:src="@{/resources/images/menu.png}" alt="Logo" class="logo">
            </div>
            <span class="logo-text">TennisScoreboard</span>
        </div>
        <div>
            <nav class="nav-links">
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/matches}">Matches</a>
            </nav>
        </div>
    </section>
</header>
<main>
    <div class="container">
        <h1>Matches</h1>
        <div class="input-container">
            <form id="filter-form" method="get" th:action="@{/matches}">
                <input class="input-filter" id="filter-input" name="name" placeholder="Filter by name" type="text" th:value="${name}"/>
                <input type="submit" class="btn-filter" value="Search">
            </form>
            <div>
                <a th:href="@{/matches}" id="reset-filter">
                    <button class="btn-filter">Reset Filter</button>
                </a>
            </div>
        </div>

        <table class="table-matches">
            <thead>
            <tr>
                <th>Player One</th>
                <th>Player Two</th>
                <th>Winner</th>
            </tr>
            </thead>
            <tbody id="matches-body">

            <tr th:each="match : ${matches}">
                <td th:text="${match.firstPlayerDto.name}"></td>
                <td th:text="${match.secondPlayerDto.name}"></td>
                <td th:text="${match.winner.name}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(matches)}">
                <td colspan="3">No matches found.</td>
            </tr>

            </tbody>
        </table>

        <div class="pagination">
            <a
                    th:if="${page > 1}"
                    th:href="@{/matches(page=${page - 1}, name=${name})}"
                    class="prev">
                &lt;
            </a>

            <span th:text="${page}"></span>

            <a
                    th:if="${pageQuantity > page}"
                    th:href="@{/matches(page=${page + 1}, name=${name})}"
                    class="next">
                &gt;
            </a>
        </div>
    </div>
</main>
<footer>
    <div class="footer">
        <p>&copy; Tennis Scoreboard, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a>
            roadmap.</p>
    </div>
</footer>
</body>
</html>
