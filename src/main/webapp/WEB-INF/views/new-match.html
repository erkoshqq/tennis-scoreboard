<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Scoreboard | New Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
</head>
<body>
<header class="header">
    <section class="nav-header">
        <div class="brand">
            <div class="nav-toggle">
                <img th:src="@{/resources/images/menu.png}" alt="Logo" class="logo">
            </div>
            <span class="logo-text">TennisScoreboard</span>
        </div>
        <div>
            <nav class="nav-links">
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/matches}">Matches</a>
            </nav>
        </div>
    </section>
</header>
<main>
    <div class="container">
        <div>
            <h1>Start new match</h1>
            <div class="new-match-image"></div>
            <div class="form-container center">
                <form th:method="post" th:action="@{/matches}" th:object="${matchForm}" id="new-match-form">
                    <div style="color: red"
                         th:if="${#fields.hasGlobalErrors()}"
                         th:errors="*">
                    </div>

                    <label class="label-player" for="playerOne">Player one</label>
                    <input id="playerOne" class="input-player" placeholder="Name" th:field="*{firstName}" type="text" required
                           title="Enter a name">
                    <div style="color: red" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Name error</div>
                    <br/>
                    <label class="label-player" for="playerTwo">Player two</label>
                    <input id="playerTwo" class="input-player" placeholder="Name" th:field="*{secondName}" type="text" required
                           title="Enter a name">
                    <div style="color: red" th:if="${#fields.hasErrors('secondName')}" th:errors="*{secondName}">Name error</div>
                    <br/>
                    <input class="form-button" type="submit" value="Start">
                </form>
            </div>
        </div>
    </div>
</main>
<footer>
    <div class="footer">
        <p>&copy; Tennis Scoreboard, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a>
            roadmap.</p>
    </div>
</footer>
</body>
</html>
